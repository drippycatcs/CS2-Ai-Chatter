<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6a94"/>
    </marker>
  </defs>

  <!-- background card -->
  <rect x="2" y="2" width="976" height="496" rx="18" fill="#0d1220" stroke="#2a3350" stroke-width="2"/>

  <!-- title -->
  <text x="490" y="44" text-anchor="middle" fill="#e8ecf5" font-size="22" font-weight="700">How CS2 AI Chatter works</text>
  <text x="490" y="68" text-anchor="middle" fill="#8fa0c5" font-size="13">the game process is never touched - everything flows through two ordinary files</text>

  <!-- ══ ROW 1 ══ -->

  <!-- 1. CS2 -->
  <rect x="50" y="100" width="240" height="92" rx="12" fill="#1a2238" stroke="#e2a04a" stroke-width="2"/>
  <text x="170" y="130" text-anchor="middle" fill="#e2a04a" font-size="17" font-weight="700">🎮  CS2 (the game)</text>
  <text x="170" y="152" text-anchor="middle" fill="#97a3bf" font-size="12">untouched process:</text>
  <text x="170" y="170" text-anchor="middle" fill="#97a3bf" font-size="12">no injection, no memory reads</text>

  <!-- 2. console.log -->
  <rect x="370" y="100" width="240" height="92" rx="12" fill="#1a2238" stroke="#3d4a73" stroke-width="2"/>
  <text x="490" y="130" text-anchor="middle" fill="#e8ecf5" font-size="17" font-weight="700">📄  console.log</text>
  <text x="490" y="152" text-anchor="middle" fill="#97a3bf" font-size="12">plain text file the game itself</text>
  <text x="490" y="170" text-anchor="middle" fill="#97a3bf" font-size="12">writes with -condebug</text>

  <!-- 3. bot -->
  <rect x="690" y="100" width="240" height="92" rx="12" fill="#1a2238" stroke="#3d4a73" stroke-width="2"/>
  <text x="810" y="130" text-anchor="middle" fill="#e8ecf5" font-size="17" font-weight="700">🤖  toxicBot.js</text>
  <text x="810" y="152" text-anchor="middle" fill="#97a3bf" font-size="12">parses [ALL]/[TEAM] lines,</text>
  <text x="810" y="170" text-anchor="middle" fill="#97a3bf" font-size="12">filters, blacklist, cooldown</text>

  <!-- ══ ROW 2 ══ -->

  <!-- 4. AI -->
  <rect x="690" y="300" width="240" height="92" rx="12" fill="#1a2238" stroke="#7c5cff" stroke-width="2"/>
  <text x="810" y="330" text-anchor="middle" fill="#b39dff" font-size="17" font-weight="700">🧠  AI engine</text>
  <text x="810" y="352" text-anchor="middle" fill="#97a3bf" font-size="12">Ollama (local GPU) or</text>
  <text x="810" y="370" text-anchor="middle" fill="#97a3bf" font-size="12">OpenRouter (cloud)</text>

  <!-- 5. reply -->
  <rect x="370" y="300" width="240" height="92" rx="12" fill="#1a2238" stroke="#3d4a73" stroke-width="2"/>
  <text x="490" y="330" text-anchor="middle" fill="#e8ecf5" font-size="17" font-weight="700">💬  reply</text>
  <text x="490" y="352" text-anchor="middle" fill="#97a3bf" font-size="12">personality + anti-repetition</text>
  <text x="490" y="370" text-anchor="middle" fill="#97a3bf" font-size="12">+ humanizer + splitter</text>

  <!-- 6. cfg -->
  <rect x="50" y="300" width="240" height="92" rx="12" fill="#1a2238" stroke="#4fbf8b" stroke-width="2"/>
  <text x="170" y="330" text-anchor="middle" fill="#6fdca8" font-size="17" font-weight="700">⌨️  liveinput.cfg</text>
  <text x="170" y="352" text-anchor="middle" fill="#97a3bf" font-size="12">say &lt;reply&gt; written to cfg,</text>
  <text x="170" y="370" text-anchor="middle" fill="#97a3bf" font-size="12">one simulated key tap ("v")</text>

  <!-- ══ ARROWS ══ -->

  <!-- 1 → 2 -->
  <line x1="290" y1="146" x2="366" y2="146" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="328" y="136" text-anchor="middle" fill="#8fa0c5" font-size="11">writes chat</text>

  <!-- 2 → 3 -->
  <line x1="610" y1="146" x2="686" y2="146" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="648" y="136" text-anchor="middle" fill="#8fa0c5" font-size="11">fs.watch</text>

  <!-- 3 → 4 -->
  <line x1="810" y1="192" x2="810" y2="296" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="822" y="248" fill="#8fa0c5" font-size="11">prompt + chat context</text>

  <!-- 4 → 5 -->
  <line x1="690" y1="346" x2="614" y2="346" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="652" y="336" text-anchor="middle" fill="#8fa0c5" font-size="11">generated text</text>

  <!-- 5 → 6 -->
  <line x1="370" y1="346" x2="294" y2="346" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="332" y="336" text-anchor="middle" fill="#8fa0c5" font-size="11">queued send</text>

  <!-- 6 → 1 -->
  <line x1="170" y1="300" x2="170" y2="196" stroke="#5b6a94" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="182" y="248" fill="#8fa0c5" font-size="11">CS2 runs "exec liveinput" - a normal keybind</text>

  <!-- footer -->
  <line x1="50" y1="428" x2="930" y2="428" stroke="#2a3350" stroke-width="1.5"/>
  <text x="490" y="456" text-anchor="middle" fill="#8fa0c5" font-size="13">
    <tspan fill="#6fdca8" font-weight="700">read a log file  ·  write a cfg file  ·  tap a key</tspan>
    <tspan> - both files are official game features. Nothing runs inside the game.</tspan>
  </text>
  <text x="490" y="478" text-anchor="middle" fill="#5f6c8e" font-size="12">VAC scans the game process for tampering - this tool never opens that process at all.</text>
</svg>
